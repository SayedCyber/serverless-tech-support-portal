<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Tech Support Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, textarea, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .hidden { display: none; }
        .success { color: green; }
    </style>
</head>
<body>

<div class="container">
    <h2>Tech Support Portal</h2>

    <!-- Login / Register Section -->
    <div id="auth-section">
        <h3>Login / Register</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="signUp()">Register</button>
        <button onclick="signIn()">Login</button>
        <p id="auth-msg" class="success"></p>
    </div>

    <!-- Ticket Section (Hidden until logged in) -->
    <div id="ticket-section" class="hidden">
        <h3>Create Support Ticket</h3>
        <input type="text" id="subject" placeholder="Subject">
        <textarea id="description" placeholder="Description" rows="4"></textarea>
        <button onclick="createTicket()">Submit Ticket</button>
        <p id="ticket-msg" class="success"></p>
    </div>
</div>

<!-- AWS SDK for Cognito and API calls -->
<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@5.2.11/dist/amazon-cognito-identity.min.js"></script>
<script>
    // Replace these values with your CDK deployment outputs
    const poolData = {
        UserPoolId: 'us-east-1_ZVVHgGJTF', 
        ClientId: '4i44s2377pt8954r9nma4v03ej'      
    };

    const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
    let idToken = '';

    // Function to handle user sign-up
    function signUp() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const attributeList = [
            new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'email', Value: email })
        ];

        userPool.signUp(email, password, attributeList, null, (err, result) => {
            if (err) {
                document.getElementById('auth-msg').innerText = err.message || JSON.stringify(err);
                return;
            }
            document.getElementById('auth-msg').innerText = 'Registration successful! Please check your email and login.';
        });
    }

    // Function to handle user sign-in and retrieve JWT token
    function signIn() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails({
            Username: email,
            Password: password,
        });

        const userData = { Username: email, Pool: userPool };
        const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);

        cognitoUser.authenticateUser(authenticationDetails, {
            onSuccess: (result) => {
                idToken = result.getIdToken().getJwtToken();
                document.getElementById('auth-msg').innerText = 'Login successful!';
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('ticket-section').classList.remove('hidden');
            },
            onFailure: (err) => {
                document.getElementById('auth-msg').innerText = err.message || JSON.stringify(err);
            },
        });
    }

    // Function to create a support ticket via API Gateway with authorization header
    async function createTicket() {
        const subject = document.getElementById('subject').value;
        const description = document.getElementById('description').value;
        const apiURL = 'https://w2k9yhms53.execute-api.us-east-1.amazonaws.com/prod/';

        try {
            const response = await fetch(apiURL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': idToken // Send the JWT token for authentication
                },
                body: JSON.stringify({ subject, description })
            });

            const data = await response.json();
            if (response.ok) {
                document.getElementById('ticket-msg').innerText = 'Ticket created successfully!';
            } else {
                document.getElementById('ticket-msg').innerText = 'Error: ' + (data.error || 'Failed');
            }
        } catch (error) {
            document.getElementById('ticket-msg').innerText = 'Error: ' + error.message;
        }
    }
</script>

</body>
</html>
