<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Support Portal</title>
    <!-- AWS Cognito Identity JS SDK for real authentication -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 50px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; margin-bottom: 20px; }
        h2 { color: #333; }
        label { display: block; margin-top: 15px; color: #555; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 12px; width: 100%; margin-top: 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        .hidden { display: none; }
        .toggle-btn { background: none; border: none; color: #007bff; cursor: pointer; margin-top: 15px; width: 100%; text-align: center; font-size: 14px; }
        .toggle-btn:hover { text-decoration: underline; }
        #response-message, #auth-message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- Auth Section (Login / Register / Verify) -->
    <div id="auth-section">
        <h2 id="auth-title">Login</h2>
        
        <form id="auth-form">
            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" required>

            <!-- Verification code field (hidden by default) -->
            <div id="verification-field" class="hidden">
                <label for="code">Verification Code (Check your email):</label>
                <input type="text" id="code">
            </div>

            <button type="submit" id="auth-submit-btn">Login</button>
        </form>

        <button type="button" class="toggle-btn" id="toggle-auth-mode">Don't have an account? Register</button>
        <p id="auth-message"></p>
    </div>

    <!-- Ticket Section (Hidden until user logs in with real token) -->
    <div id="ticket-section" class="hidden">
        <h2>Create Support Ticket</h2>
        <form id="ticket-form">
            <label for="subject">Subject:</label>
            <input type="text" id="subject" required>

            <label for="description">Description:</label>
            <textarea id="description" rows="4" required></textarea>

            <button type="submit">Submit Ticket</button>
        </form>
        <p id="response-message"></p>
    </div>
</div>

<script>
    // --- CONFIGURE COGNITO DETAILS ---
    const poolData = {
        UserPoolId: 'us-east-1_1sxQgMhRk',
        ClientId: '6bhm6ttnvbehou5jtrqf320m3o'
    };

    const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
    let authMode = 'login'; // 'login', 'register', or 'verify'
    let registeredEmail = '';
    let validIdToken = '';

    const authTitle = document.getElementById('auth-title');
    const authSubmitBtn = document.getElementById('auth-submit-btn');
    const toggleAuthBtn = document.getElementById('toggle-auth-mode');
    const verificationField = document.getElementById('verification-field');
    const authMessage = document.getElementById('auth-message');

    // Toggle between modes
    toggleAuthBtn.addEventListener('click', function() {
        authMessage.textContent = '';
        if (authMode === 'login') {
            authMode = 'register';
            authTitle.textContent = 'Register';
            authSubmitBtn.textContent = 'Register';
            toggleAuthBtn.textContent = 'Already have an account? Login';
            verificationField.classList.add('hidden');
        } else {
            authMode = 'login';
            authTitle.textContent = 'Login';
            authSubmitBtn.textContent = 'Login';
            toggleAuthBtn.textContent = "Don't have an account? Register";
            verificationField.classList.add('hidden');
        }
    });

    // Handle Auth Form Submission (Real AWS Cognito Calls)
    document.getElementById('auth-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const code = document.getElementById('code').value;

        authMessage.style.color = '#555';

        if (authMode === 'register') {
            authMessage.textContent = 'Registering account...';
            const attributeList = [
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'email', Value: email })
            ];

            userPool.signUp(email, password, attributeList, null, function(err, result) {
                if (err) {
                    authMessage.style.color = 'red';
                    authMessage.textContent = err.message || JSON.stringify(err);
                    return;
                }
                registeredEmail = email;
                authMessage.style.color = 'green';
                authMessage.textContent = 'Registration successful! Enter the confirmation code sent to your email.';
                
                // Switch to verification mode
                authMode = 'verify';
                authTitle.textContent = 'Verify Email';
                authSubmitBtn.textContent = 'Confirm Code';
                verificationField.classList.remove('hidden');
                toggleAuthBtn.classList.add('hidden');
            });

        } else if (authMode === 'verify') {
            authMessage.textContent = 'Verifying code...';
            const userData = { Username: registeredEmail || email, Pool: userPool };
            const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);

            cognitoUser.confirmRegistration(code, true, function(err, result) {
                if (err) {
                    authMessage.style.color = 'red';
                    authMessage.textContent = err.message || JSON.stringify(err);
                    return;
                }
                authMessage.style.color = 'green';
                authMessage.textContent = 'Email verified successfully! You can now login.';
                
                // Switch back to login mode
                authMode = 'login';
                authTitle.textContent = 'Login';
                authSubmitBtn.textContent = 'Login';
                verificationField.classList.add('hidden');
                toggleAuthBtn.classList.remove('hidden');
            });

        } else {
            // Real Login
            authMessage.textContent = 'Logging in...';
            const authenticationData = { Username: email, Password: password };
            const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails(authenticationData);
            
            const userData = { Username: email, Pool: userPool };
            const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);

            cognitoUser.authenticateUser(authenticationDetails, {
                onSuccess: function(result) {
                    validIdToken = result.getIdToken().getJwtToken();
                    authMessage.style.color = 'green';
                    authMessage.textContent = 'Login successful!';
                    
                    // Hide auth box and show ticket form
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('ticket-section').classList.remove('hidden');
                },
                onFailure: function(err) {
                    authMessage.style.color = 'red';
                    authMessage.textContent = err.message || JSON.stringify(err);
                },
            });
        }
    });

    // Handle ticket submission using the real JWT token
    document.getElementById('ticket-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const subject = document.getElementById('subject').value;
        const description = document.getElementById('description').value;
        const messageElement = document.getElementById('response-message');
        
        messageElement.style.color = '#555';
        messageElement.textContent = 'Submitting ticket...';

        try {
            const response = await fetch('https://w2k9yhms53.execute-api.us-east-1.amazonaws.com/prod/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': validIdToken
                },
                body: JSON.stringify({ subject, description })
            });

            const data = await response.json();

            if (response.ok) {
                messageElement.style.color = 'green';
                messageElement.textContent = 'Ticket created successfully!';
                document.getElementById('ticket-form').reset();
            } else {
                messageElement.style.color = 'red';
                messageElement.textContent = 'Error: ' + (data.error || 'Failed to create ticket');
            }
        } catch (error) {
            messageElement.style.color = 'red';
            messageElement.textContent = 'Network error: ' + error.message;
        }
    });
</script>

</body>
</html>
