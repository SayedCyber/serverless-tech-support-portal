<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Tech Support Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, textarea, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .hidden { display: none; }
        .success { color: green; }
        .error { color: red; }
        .header-auth { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-auth" id="header-auth"></div>

    <h2>Tech Support Portal</h2>

    <div id="auth-section">
        <h3>Authentication Required</h3>
        <p>Please sign in using your account to submit support tickets.</p>
        <button onclick="signIn()">Sign In / Register</button>
        <p id="auth-msg" class="success"></p>
    </div>

    <div id="ticket-section" class="hidden">
        <h3>Create Support Ticket</h3>
        <input type="text" id="subject" placeholder="Subject">
        <textarea id="description" placeholder="Description" rows="4"></textarea>
        <button onclick="createTicket()">Submit Ticket</button>
        <p id="ticket-msg" class="success"></p>
    </div>
</div>

<script>
    const COGNITO_DOMAIN = "https://us-east-1zvvhggjtf.auth.us-east-1.amazoncognito.com";
    const COGNITO_CLIENT_ID = "4i44s2377pt8954r9nma4v03ej"; 
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const API_URL = "https://w2k9yhms53.execute-api.us-east-1.amazonaws.com/prod/";

    function getStoredToken() {
        return sessionStorage.getItem("support_access_token");
    }

    function getStoredEmail() {
        return sessionStorage.getItem("support_email");
    }

    function signIn() {
        const authUrl = `${COGNITO_DOMAIN}/oauth2/authorize` +
            `?client_id=${COGNITO_CLIENT_ID}` +
            `&response_type=code` +
            `&scope=email+openid+profile` +
            `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
        window.location.href = authUrl;
    }

    function signOut() {
        sessionStorage.removeItem("support_access_token");
        sessionStorage.removeItem("support_email");
        const logoutUrl = `${COGNITO_DOMAIN}/logout` +
            `?client_id=${COGNITO_CLIENT_ID}` +
            `&logout_uri=${encodeURIComponent(REDIRECT_URI)}`;
        window.location.href = logoutUrl;
    }

    async function exchangeCodeForToken(code) {
        const body = new URLSearchParams({
            grant_type: "authorization_code",
            client_id: COGNITO_CLIENT_ID,
            code: code,
            redirect_uri: REDIRECT_URI,
        });

        try {
            const res = await fetch(`${COGNITO_DOMAIN}/oauth2/token`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: body.toString(),
            });

            if (!res.ok) throw new Error("Token exchange failed");
            const tokens = await res.json();

            const idPayload = JSON.parse(atob(tokens.id_token.split(".")[1]));

            sessionStorage.setItem("support_access_token", tokens.id_token);
            sessionStorage.setItem("support_email", idPayload.email || "User");
        } catch (err) {
            console.error(err);
        }
    }

    function updateUI() {
        const token = getStoredToken();
        const email = getStoredEmail();
        const headerAuth = document.getElementById("header-auth");
        const authSection = document.getElementById("auth-section");
        const ticketSection = document.getElementById("ticket-section");

        if (token) {
            headerAuth.innerHTML = `<span>Signed in as: <b>${email}</b></span> <button onclick="signOut()" style="width:auto; padding:5px 10px; margin:0;">Sign Out</button>`;
            authSection.classList.add("hidden");
            ticketSection.classList.remove("hidden");
        } else {
            headerAuth.innerHTML = "";
            authSection.classList.remove("hidden");
            ticketSection.classList.add("hidden");
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        if (code) {
            window.history.replaceState({}, document.title, window.location.pathname);
            await exchangeCodeForToken(code);
        }
        updateUI();
    });

    async function createTicket() {
        const subject = document.getElementById('subject').value;
        const description = document.getElementById('description').value;
        const token = getStoredToken();
        const msgEl = document.getElementById('ticket-msg');

        if (!subject || !description) {
            msgEl.className = "error";
            msgEl.innerText = "Please fill in all fields.";
            return;
        }

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token 
                },
                body: JSON.stringify({ subject, description })
            });

            const data = await response.json();
            if (response.ok) {
                msgEl.className = "success";
                msgEl.innerText = 'Ticket created successfully!';
                document.getElementById('subject').value = '';
                document.getElementById('description').value = '';
            } else {
                msgEl.className = "error";
                msgEl.innerText = 'Error: ' + (data.error || 'Failed');
            }
        } catch (error) {
            msgEl.className = "error";
            msgEl.innerText = 'Error: ' + error.message;
        }
    }
</script>

</body>
</html>
